
services:
  - type: web
    name: pup-carelink-testing-backend
    region: oregon
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "PUPBC CareLink"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        # I-generate gamit ang php artisan key:generate --show.
        # Ilagay ang value sa Render dashboard.
        sync: false
      - key: APP_URL
        value: https://pup-carelink-testing-backend.onrender.com
      - key: FRONTEND_URL
        value: https://pup-carelink-testing-frontend.onrender.com

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SUPABASE_URL
        value: https://rbrhhuisskfdienbkqao.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      - key: JWT_SECRET
        sync: false
      - key: JWT_TTL
        value: "1440"

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: pupbccarelink@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: pupbccarelink@gmail.com
      - key: MAIL_FROM_NAME
        value: "PUPBC CareLink"

      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DRIVER
        value: local

      - key: SANCTUM_STATEFUL_DOMAINS
        value: pup-carelink-testing-frontend.onrender.com

      - key: SLOT_MAX
        value: "10"
      - key: CLINIC_OPEN_TIME
        value: "08:00"
      - key: CLINIC_CLOSE_TIME
        value: "17:00"
      - key: LUNCH_START
        value: "12:00"
      - key: LUNCH_END
        value: "13:00"

      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: KIOSK_RATE_LIMIT
        value: "30"
      - key: AUTH_RATE_LIMIT
        value: "10"

  - type: web
    name: pup-carelink-testing-frontend
    region: oregon
    plan: free
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://pup-carelink-testing-backend.onrender.com/api
      - key: VITE_APP_NAME
        value: "PUPBC CareLink"
